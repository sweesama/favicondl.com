openapi: 3.0.3
info:
  title: Mzu FaviconDL API
  description: >
    The authoritative API for extracting high-quality, high-resolution favicons from any domain.
    Supports SVG parsing, multi-size manifest.json extraction, Apple Touch Icons, and fallback aggregation.
  version: "1.0.0"
  contact:
    name: Mzu FaviconDL
    url: https://favicondl.com
servers:
  - url: https://favicondl.com
    description: Production Server

paths:
  /api/extract:
    get:
      summary: Download or resolve a website favicon
      description: >
        Finds a usable favicon from the target domain and redirects to a
        downloadable image URL by default. Use format=json to receive the
        resolved icon URL and source metadata instead. When size is set
        (16-512, for example 32), the image is a PNG of exactly that square
        size. Omit size for the original file. A smaller raster is upscaled
        and may look soft. Native size is reported and is not described as sharp
        when the image was enlarged.
      operationId: extractFavicon
      parameters:
        - name: url
          in: query
          required: true
          description: Target domain or URL, for example github.com or https://github.com/docs
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: >
            Exact output size in pixels. Clamped to 16-512. Examples: 16, 32, 64, 128, 256, 512.
            Omit the parameter for the original file.
          schema:
            type: integer
            minimum: 16
            maximum: 512
        - name: format
          in: query
          required: false
          description: Use json for metadata; omit it for a 302 image redirect.
          schema:
            type: string
            enum: [redirect, json]
            default: redirect
      responses:
        '302':
          description: Redirect to the resolved downloadable image URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '200':
          description: Resolved favicon metadata when format=json is requested.
          content:
            application/json:
              schema:
                type: object
                required: [ok, domain, size, iconUrl, proxyUrl, source]
                properties:
                  ok:
                    type: boolean
                  domain:
                    type: string
                  size:
                    type: integer
                  iconUrl:
                    type: string
                    format: uri
                  proxyUrl:
                    type: string
                    format: uri
                  source:
                    type: string
                    description: Where the chosen icon was found.
                    enum: [html, manifest, direct, google_s2, duckduckgo]
                  rel:
                    type: string
                    nullable: true
                    description: The link rel or manifest entry the icon came from.
                  format:
                    type: string
                    nullable: true
                    description: Detected image format (svg, png, ico, webp, jpeg, gif ...).
                  width:
                    type: integer
                    nullable: true
                    description: Measured source width in pixels; null for SVG.
                  height:
                    type: integer
                    nullable: true
                    description: Measured source height in pixels; null for SVG.
                  nativeWidth:
                    type: integer
                    nullable: true
                    description: Source width. Null for SVG. Same measurement as width.
                  nativeHeight:
                    type: integer
                    nullable: true
                  vector:
                    type: boolean
                  resized:
                    type: boolean
                    description: True when size was set and proxyUrl is an exact square PNG.
                  upscaled:
                    type: boolean
                    description: True when a raster source was enlarged. That PNG may look soft.
                  outputFormat:
                    type: string
                    description: png when size is set.
                  outputWidth:
                    type: integer
                    description: Exact width of proxyUrl when size is set. For example 32.
                  outputHeight:
                    type: integer
                  pageUrl:
                    type: string
                    nullable: true
                    description: Final homepage URL after redirects.
                  candidates:
                    type: array
                    description: Up to 8 verified icons from the site, best first. Empty when a fallback service was used.
                    items:
                      type: object
                      properties:
                        url: { type: string, format: uri }
                        proxyUrl: { type: string, format: uri }
                        source: { type: string }
                        rel: { type: string }
                        format: { type: string }
                        width: { type: integer, nullable: true }
                        height: { type: integer, nullable: true }
                        vector: { type: boolean }
                        bytes: { type: integer }
        '400':
          description: Missing URL or invalid format
        '502':
          description: Favicon discovery failed
        '504':
          description: Favicon discovery timed out
