name: Notify IndexNow After Publish

on:
  push:
    branches:
      - main
    paths:
      - 'blog/*.html'
      - 'zh/blog/*.html'
      - 'ja/blog/*.html'
      - 'ko/blog/*.html'
      - 'es/blog/*.html'
      - 'blog/articles.json'
      - 'sitemap.xml'

permissions:
  contents: read

concurrency:
  group: favicondl-indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication
        uses: actions/checkout@v4
        with:
          # A push can contain more than one commit. The event's `before` SHA
          # must be present so the workflow can compare the whole push.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find published article slugs
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="$BEFORE_SHA"
          ZERO_SHA="0000000000000000000000000000000000000000"

          # A normal push is covered by the full-history checkout above. Keep a
          # safe fallback for unusual events such as a recreated or force-pushed
          # branch so an indexing notification can never break the publish run.
          if [[ "$BASE_SHA" == "$ZERO_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::The push base commit is unavailable; comparing the latest commit only."
            BASE_SHA=$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)
          fi

          if [[ -z "$BASE_SHA" ]]; then
            echo "slugs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUGS=$(git diff --name-only "$BASE_SHA" "$AFTER_SHA" -- \
            'blog/*.html' \
            'zh/blog/*.html' \
            'ja/blog/*.html' \
            'ko/blog/*.html' \
            'es/blog/*.html' | node -e "
              const fs = require('fs');
              const path = require('path');
              const slugs = [...new Set(fs.readFileSync('/dev/stdin', 'utf8')
                .split(/\\r?\\n/)
                .filter(Boolean)
                .map(file => path.basename(file, '.html'))
                .filter(slug => slug !== 'index'))];
              process.stdout.write(slugs.join(' '));
            ")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow participants
        if: steps.changed.outputs.slugs != ''
        run: node blog/scripts/ping-indexnow.js ${{ steps.changed.outputs.slugs }}

      - name: Nothing to notify
        if: steps.changed.outputs.slugs == ''
        run: echo "No indexable article URL changed."
